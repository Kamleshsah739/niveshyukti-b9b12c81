name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Website
        run: bun run build

      - name: Prepare dist folder
        run: |
          rm -rf dist
          mkdir -p dist

          if [ -d ".output/public" ]; then
            cp -R .output/public/. dist/
          elif [ -d "build/client" ]; then
            cp -R build/client/. dist/
          elif [ -d "dist/client" ]; then
            cp -R dist/client/. dist/
          else
            echo "Static build output was not found."
            echo "Available directories:"
            find . -maxdepth 3 -type d | sort
            exit 1
          fi

          touch dist/.nojekyll

          echo "Files prepared for GitHub Pages:"
          find dist -maxdepth 3 -type f | head -100

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
